<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Gustavo Guanabara</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.3em;
        }

        table {
            border-collapse: collapse;
        }
       
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        .principal {
            background-color: gray;
            color: white;

        }

        .Média {
            text-align: left;
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col" class="principal">Área</th>
                <th rowspan="2" scope="col" class="principal">Disciplinas</th>
                <th colspan="2" scope="colgroup" class="principal">Notas</th>
                <Th rowspan="2" scope="col" class="principal">Média</Th>
            </tr>

            <tr>
                <th scope="col" class="principal">Notas 1</th>
                <th scope="col" class="principal">Notas 2</th>
            </tr>
        </thead>

        <tbody>
            <!-- Grupo Exatas -->
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matématica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
              

            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Quimíca</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th colspan="4" class="Média">Média de Exatas</td>
                <td>0.0</td>
            </tr>


            <!-- Grupo Humanas -->
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th colspan="4" class="Média">Média de Humanas</th>
                <td>0.0</td>
            </tr>

            
        

            

        </tbody>
     
    </table>
</body>
</html>

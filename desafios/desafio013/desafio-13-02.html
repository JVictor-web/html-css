<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de tabela do Gustavo Guanabara</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        table {
            background-color: rgba(0, 0, 0, 0.418);
            border-collapse: separate;
            width: 300px;
            height: 200px;
        }

        td {
            border: 1px solid rgb(14, 13, 13);
            padding: 5px;
            text-align: center;
            color:  yellowgreen;
        }

        td:hover {
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.459);
        }

        td:active{
            transform: scale(97%);
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">B</td>
        </tr>

        <tr>
            <td rowspan="4">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>

        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>

        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
        </tr>

        <tr>
            <td colspan="5">N</td>
        </tr>
    </table>
</body>
</html>
